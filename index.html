<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THM Career Mapper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap');
      
      :root {
        --bg-depth: #050608;
        --grid-color: rgba(6, 182, 212, 0.05);
        --neon-cyan: #06b6d4;
        --neon-emerald: #10b981;
      }

      body {
        font-family: 'Rajdhani', sans-serif;
        background-color: var(--bg-depth);
        color: #e2e8f0;
        height: 100vh;
        overflow: hidden;
        font-size: 0.9rem; /* Compact base size */
        line-height: 1.4;
      }

      .font-mono { font-family: 'JetBrains Mono', monospace; }

      /* Optimized Grid - Static transform for performance */
      .cyber-grid {
        position: fixed;
        inset: 0;
        background-image: 
          linear-gradient(var(--grid-color) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
        background-size: 40px 40px;
        z-index: -2;
        pointer-events: none;
        will-change: transform;
      }

      /* Tighter, faster scrollbars */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #020202; }
      ::-webkit-scrollbar-thumb { background: #334155; }
      ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }

      /* Utility for high-density truncation */
      .text-xxs { font-size: 0.65rem; line-height: 1rem; }
      
      /* GPU Accelerated Hover Effects */
      .gpu-transition {
        transition-property: transform, opacity, border-color, background-color;
        transition-duration: 150ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform, opacity;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
</head>
  <body>
    <div class="cyber-grid"></div>
    <div id="root"></div>
  </body>
</html>
